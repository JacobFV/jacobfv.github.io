<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
    <script>
      (function () {
        var path = window.location.pathname;
        // ComputerWorld moved: its old GitHub Pages site lived at /computerworld/.
        var moved = /^\/computerworld(\/|$)/i.test(path);
        var target = new URL(moved ? "https://computaco.ai" : "https://jvboid.dev");
        target.pathname = moved ? (path.replace(/^\/computerworld/i, "") || "/") : path;
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://jvboid.dev">jvboid.dev</a>.</p>
  </body>
</html>
